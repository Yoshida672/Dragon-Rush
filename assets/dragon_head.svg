<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="#ff0000"/>
    </radialGradient>
  </defs>
  <!-- Main Head Silhouette -->
  <path d="M 10,20 L 120,80 L 190,120 L 150,140 L 110,145 L 10,190 Z" fill="#140c14"/>
  <!-- Horns -->
  <path d="M 80,70 Q 140,20 180,10 L 120,80 Z" fill="#261726"/>
  <circle cx="180" cy="10" r="5" fill="#ff4500"/>
  <!-- Glowing Throat -->
  <ellipse cx="120" cy="140" rx="30" ry="20" fill="#ff3300" opacity="0.8"/>
  <!-- Glowing Eye -->
  <circle cx="125" cy="95" r="12" fill="url(#eyeGlow)"/>
  <ellipse cx="125" cy="95" rx="2" ry="8" fill="#000000"/>
  <!-- Teeth -->
  <polygon points="170,125 175,138 180,125" fill="#fff5e6"/>
  <polygon points="155,128 160,140 165,128" fill="#fff5e6"/>
</svg>
