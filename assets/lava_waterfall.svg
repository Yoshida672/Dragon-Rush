<svg xmlns="http://www.w3.org/2000/svg" width="40" height="200" viewBox="0 0 40 200">
  <defs>
    <linearGradient id="lavaStream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="30%" stop-color="#ff4500"/>
      <stop offset="70%" stop-color="#e60000"/>
      <stop offset="100%" stop-color="#ff6600"/>
    </linearGradient>
  </defs>
  <!-- Main Waterfall Stream -->
  <rect width="40" height="200" fill="url(#lavaStream)" opacity="0.9"/>
  <!-- Glowing Surface Lines -->
  <line x1="10" y1="0" x2="10" y2="200" stroke="#ffff00" stroke-width="3" stroke-dasharray="20 10"/>
  <line x1="30" y1="0" x2="30" y2="200" stroke="#ffff00" stroke-width="3" stroke-dasharray="15 15"/>
</svg>
